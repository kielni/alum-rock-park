<!doctype html>
<html data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Alum Rock Park volunteer work areas</title>
    <script src="config.js"></script>
    <script src="map.js"></script>
    <script src="gallery.js"></script>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.10.2/maptiler-sdk.umd.min.js"></script>
    <link
      href="https://cdn.maptiler.com/maptiler-sdk-js/v3.10.2/maptiler-sdk.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bulma@1/css/bulma.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body class="map-photos">
    <div id="app">
      <div id="map"></div>
      <div id="gallery"></div>
    </div>
    <div id="markers"></div>
    <script>
      maptilersdk.config.apiKey = MAP_TILER_API_KEY;

      let mapStyle = maptilersdk.MapStyle.HYBRID;
      if (window.location.search.includes("print")) {
        mapStyle = maptilersdk.MapStyle.OUTDOOR;
      }

      const appContainer = document.getElementById("map");
      const map = new maptilersdk.Map({
        container: appContainer,
        style: mapStyle,
        center: [-121.8091, 37.399], // starting position [lng, lat]
        zoom: 16, // starting zoom
      });

      map.on("load", async function () {
        const response = await fetch(HOST + "ARP_areas.geojson");
        const geojsonData = await response.json();
        const sheetData = await loadSheetData();
        const photoRecords = await loadPhotos();
        const workDayCounts = countWorkDays(photoRecords);
        const data = mergeData(geojsonData, sheetData, workDayCounts);

        const [fillLayerId, outlineLayerId] = drawAreas(map, data);
        const markerLayerId = createMarkers(map, data);
        const { layerId: clusterLayerId, features: clusterFeatures } =
          createClusterMarkers(map, photoRecords);

        addControls(map, outlineLayerId);
        addFilterClick(map, fillLayerId);
        addFilterClick(map, markerLayerId);
        addFilterClick(map, clusterLayerId);
        fitMapToMarkers(map, data, clusterFeatures, markerLayerId);

        window.addEventListener("location-in-view", (e) => {
          highlightArea(map, outlineLayerId, e.detail);
        });
      });
    </script>
  </body>
</html>
